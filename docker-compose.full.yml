#version: '3.4'
services:
  # Bases de datos a la cual me conectaré desde mi proyecto
  userdb:
    image: postgres:15
    container_name: usermicroservice.db
    restart: always
    environment:
      POSTGRES_DB: usersDb
      POSTGRES_USER: adminuser
      POSTGRES_PASSWORD: adminuser123
    ports:
      - "5435:5432"
    volumes:
      - ./postgres_data_users:/var/lib/postgresql/data/
      - ./init-scripts/userdb-init.sql:/docker-entrypoint-initdb.d/userdb-init.sql
    networks:
      - NetworkTaskApp


  taskdb:
    image: postgres:15
    container_name: taskmicroservice.db
    restart: always
    environment:
      POSTGRES_DB: tasksDb
      POSTGRES_USER: admintask
      POSTGRES_PASSWORD: admintask123
    ports:
      - "5436:5432"
    volumes:
      - ./postgres_data_tasks:/var/lib/postgresql/data/
      - ./init-scripts/taskdb-init.sql:/docker-entrypoint-initdb.d/taskdb-init.sql
    networks:
      - NetworkTaskApp


  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: rabbitmq.taskbroker
    ports:
      - "5672:5672"
      - "15672:15672"  # web de administración
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: 123
    networks:
      - NetworkTaskApp

  # backend de los microservicios
  userservice:
    image: taskapp/userservice:latest
    container_name: usermicroservice.app
    build:
      context: ./microservice-users
      dockerfile: Dockerfile
    ports:
      - "8091:8091"
    depends_on:
      - userdb
    env_file:
      - .env.user.test
    environment:
      SPRING_PROFILES_ACTIVE: test
    networks:
      - NetworkTaskApp


  taskservice:
    image: taskapp/taskservice:latest
    container_name: taskmicroservice.app
    build:
      context: ./microservice-tasks
      dockerfile: Dockerfile
    ports:
      - "8092:8092"
    depends_on:
      - taskdb
      - rabbitmq
    env_file:
      - .env.task.test
    environment:
      SPRING_PROFILES_ACTIVE: test
    networks:
      - NetworkTaskApp

  notificationservice:
    image: taskapp/notificationservice:latest
    container_name: notificationmicroservice.app
    build:
      context: ./microservice-notification
      dockerfile: Dockerfile
    ports:
      - "8093:8093"
    depends_on:
      - rabbitmq
    env_file:
      - .env.notification.test
    environment:
      SPRING_PROFILES_ACTIVE: test
    networks:
      - NetworkTaskApp

  frontend:
    image: taskapp/frontend:latest
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - userservice
      - taskservice
      - notificationservice
    networks:
      - NetworkTaskApp

  # para el monitoreo de la aplicación
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - NetworkTaskApp

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
    networks:
      - NetworkTaskApp


volumes:
  postgres_data:
  grafana-storage:

networks:
  NetworkTaskApp:
    driver: bridge